name: Windows tuxedo skin build
on:
  push:
    branches: [feat/windows-slender-tuxedo]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build application
        shell: cmd
        run: |
          cd windows
          call build.bat
      - name: Build and check native preview
        shell: cmd
        run: |
          cd windows
          cl /nologo /std:c++17 /EHsc /utf-8 tests\tuxedo-preview.cpp /Fe:tuxedo-preview.exe /link gdiplus.lib user32.lib advapi32.lib gdi32.lib
          if errorlevel 1 exit /b 1
          tuxedo-preview.exe
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KuroCat-Windows-tuxedo
          path: |
            windows/KuroCat.exe
            windows/tuxedo-native-preview.png
          if-no-files-found: error
